# crash-ledger: a plain Deployment+Service that remembers which turns chat-agent has already crashed on, because a crashed actor is rewound and cannot remember it itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-ledger
  namespace: checkpointd-agent-crash-demo
  labels:
    app: crash-ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash-ledger
  template:
    metadata:
      labels:
        app: crash-ledger
    spec:
      containers:
        - name: crash-ledger
          image: "${CRASH_LEDGER_IMAGE}"
          command: ["/app/crash-ledger", "--addr", "0.0.0.0:8080"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: crash-ledger
  namespace: checkpointd-agent-crash-demo
spec:
  selector:
    app: crash-ledger
  ports:
    - port: 8080
      targetPort: 8080
      name: http
