apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkpointd-server
  namespace: checkpointd-agent-crash-demo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: checkpointd-server
  namespace: checkpointd-agent-crash-demo
  labels:
    app: checkpointd-server
spec:
  serviceName: checkpointd-server
  replicas: 1
  selector:
    matchLabels:
      app: checkpointd-server
  template:
    metadata:
      labels:
        app: checkpointd-server
    spec:
      serviceAccountName: checkpointd-server
      containers:
        - name: checkpointd-server
          image: "${CHECKPOINTD_IMAGE}"
          # --discover finds agents by listing ActorTemplates through the Control API whose container sets CHECKPOINTD_AGENT=true.
          command:
            - /checkpointd-app/checkpointd
            - --config=/etc/checkpointd/checkpointd.yaml
            - --discover
            # Scopes --discover to the atespace the ActorTemplates were created in instead of every atespace.
            - --discover-atespace=checkpointd-agent-crash-demo
            - --addr=:80
            - --base-url=http://checkpointd-server.checkpointd-agent-crash-demo.svc:80
            - --substrate-ca-file=/var/run/secrets/ate-system/ca.crt
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          restartPolicy: Never
          volumeMounts:
            - name: data
              mountPath: /data
            - name: checkpointd-config
              mountPath: /etc/checkpointd
            - name: ate-token
              mountPath: /var/run/secrets/ate-system
              readOnly: true
      volumes:
        - name: checkpointd-config
          configMap:
            name: checkpointd-config
        - name: ate-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: api.ate-system.svc
                  expirationSeconds: 3600
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: ca.crt
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Not headless: kubectl port-forward svc/checkpointd-server (see demo.sh) is
# how the demo reaches this from the host, outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: checkpointd-server
  namespace: checkpointd-agent-crash-demo
spec:
  selector:
    app: checkpointd-server
  ports:
    - port: 80
      targetPort: 80
      name: http
