# Shared pool of standby ateom sandbox workers for both of this demo's
# ActorTemplates (chat-agent, reviewer-agent).
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: checkpointd-llm-chat-demo-harness
  namespace: checkpointd-llm-chat-demo
  labels:
    workload: checkpointd-llm-chat-demo-harness
spec:
  replicas: 3
  workerImage: "${ATEOM_IMAGE}"
  template:
    resources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
