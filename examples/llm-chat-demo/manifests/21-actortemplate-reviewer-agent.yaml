# ActorTemplate for reviewer-agent, built by agents.Dockerfile's `reviewer-agent` target.
apiVersion: ate.dev/v1alpha1
kind: ActorTemplate
metadata:
  name: reviewer-agent-template
  namespace: checkpointd-llm-chat-demo
spec:
  workerSelector:
    matchLabels:
      workload: checkpointd-llm-chat-demo-harness
  containers:
    - name: reviewer-agent
      image: "${REVIEWER_AGENT_IMAGE}"
      command:
        - /app/reviewer-agent
        - --harness-addr
        - 0.0.0.0:80
        - --llama-addr # same in-cluster llama-completion Service chat-agent calls
        - llama-completion.checkpointd-llm-chat-demo.svc:8080
      env:
        - name: CHECKPOINTD_AGENT
          value: "true"
        - name: CHECKPOINTD_AGENT_ID
          value: reviewer-agent
        # Only needed so chat-agent has a real card to resolve.
        - name: CHECKPOINTD_AGENT_CARD
          value: |
            name: Reviewer Agent
            description: >-
              Gives a second opinion on chat-agent's own answers, using
              the same llama.cpp completion server -- called by
              chat-agent, see examples/llm-chat-demo
            version: 1.0.0
  snapshotsConfig:
    location: "gs://ate-snapshots/checkpointd-llm-chat-demo/reviewer-agent/"
