# `checkpointd`, deployed as a long-running StatefulSet so its event log survives a pod restart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkpointd-server
  namespace: ${NS}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: checkpointd-server
  namespace: ${NS}
# --discover lists ActorTemplate CRDs directly via the Kubernetes API, so it needs RBAC to do so.
rules:
  - apiGroups: ["ate.dev"]
    resources: ["actortemplates"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: checkpointd-server
  namespace: ${NS}
subjects:
  - kind: ServiceAccount
    name: checkpointd-server
    namespace: ${NS}
roleRef:
  kind: Role
  name: checkpointd-server
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: checkpointd-server
  namespace: ${NS}
  labels:
    app: checkpointd-server
spec:
  # A restarted checkpointd process re-discovers and resumes whatever was still in flight on its own.
  serviceName: checkpointd-server
  replicas: 1
  selector:
    matchLabels:
      app: checkpointd-server
  template:
    metadata:
      labels:
        app: checkpointd-server
    spec:
      serviceAccountName: checkpointd-server
      containers:
        - name: checkpointd-server
          image: "${CHECKPOINTD_IMAGE}"
          # --discover finds agents by listing ActorTemplates whose container sets CHECKPOINTD_AGENT=true.
          command:
            - /checkpointd-app/checkpointd
            - --config=/etc/checkpointd/checkpointd.yaml
            - --discover
            - --addr=:80
            - --base-url=http://checkpointd-server.${NS}.svc:80
            - --substrate-ca-file=/var/run/secrets/ate-system/ca.crt
            # Some subtests (e.g. 01-long-poll.sh) detect relay activity by grepping this pod's own logs for a Debug-level line.
            - --log-level=debug
          env:
            # Pins --discover to this Pod's own namespace instead of scanning the whole cluster.
            - name: CHECKPOINTD_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 80
              name: http
          # A modest CPU/memory guarantee, so this pod stays responsive under the test's concurrent load.
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: checkpointd-config
              mountPath: /etc/checkpointd
            - name: ate-token
              mountPath: /var/run/secrets/ate-system
              readOnly: true
      volumes:
        - name: checkpointd-config
          configMap:
            name: checkpointd-config
        - name: ate-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: api.ate-system.svc
                  expirationSeconds: 3600
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: ca.crt
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Not headless, since kubectl port-forward reaches this from the host.
apiVersion: v1
kind: Service
metadata:
  name: checkpointd-server
  namespace: ${NS}
spec:
  selector:
    app: checkpointd-server
  ports:
    - port: 80
      targetPort: 80
      name: http
