# "agent-a": drives agent-b through its Task-state state machine via sequential nested SendMessage calls.
apiVersion: ate.dev/v1alpha1
kind: ActorTemplate
metadata:
  name: agent-a-template
  namespace: ${NS}
spec:
  workerSelector:
    matchLabels:
      workload: ${NS}-harness
  containers:
    - name: agent-a
      image: "${AGENT_A_IMAGE}"
      command: ["/app/agent-a", "--harness-addr", "0.0.0.0:80", "--checkpointd-addr", "checkpointd-server.${NS}.svc:80"]
      env:
        - name: CHECKPOINTD_AGENT
          value: "true"
        - name: CHECKPOINTD_AGENT_ID
          value: agent-a
        - name: CHECKPOINTD_AGENT_CARD
          value: |
            name: Agent A
            description: Drives agent-b through its own Task-state transitions via two sequential nested SendMessage calls, asserting on each response -- see script/test-k8s/agents/agent_a
            version: 1.0.0
  snapshotsConfig:
    location: "gs://ate-snapshots/${NS}/agent-a/"
