# "agent-a": drives agent-b through its Task-state state machine via sequential nested SendMessage calls.
metadata:
  atespace: ${ATESPACE}
  name: agent-a-template
workerSelector:
  matchLabels:
    workload: ${NS}-harness
containers:
  - name: agent-a
    image: "${AGENT_A_IMAGE}"
    command: ["/app/agent-a", "--harness-addr", "0.0.0.0:80", "--checkpointd-addr", "checkpointd-server.${NS}.svc:80"]
    env:
      - name: CHECKPOINTD_AGENT
        value: "true"
      - name: CHECKPOINTD_AGENT_ID
        value: agent-a
      - name: CHECKPOINTD_AGENT_CARD
        value: |
          name: Agent A
          description: Drives agent-b through its own Task-state transitions via two sequential nested SendMessage calls, asserting on each response -- see script/test-k8s/agents/agent_a
          version: 1.0.0
      # Substrate denies all egress to an actor without a policy, so this lists what the agent calls.
      - name: CHECKPOINTD_EGRESS_POLICY
        value: |
          rules:
            - hostnames:
                patterns: ["checkpointd-server.${NS}.svc"]
snapshotConfig:
  onPause: SNAPSHOT_CONTENT_SCOPE_FULL
  onCommit: SNAPSHOT_CONTENT_SCOPE_FULL
  storageLocation: "gs://ate-snapshots/${NS}/agent-a/"
sandboxConfig:
  sandboxClass: SANDBOX_CLASS_GVISOR
  configName: gvisor-default
