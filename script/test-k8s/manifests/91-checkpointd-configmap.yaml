# checkpointd config for script/test-k8s, holding only version and eventlog since agent discovery comes from --discover.
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkpointd-config
  namespace: ${NS}
data:
  checkpointd.yaml: |
    version: v1alpha

    eventlog:
      sqlite:
        filename: "/data/eventlog/log.sqlite"
