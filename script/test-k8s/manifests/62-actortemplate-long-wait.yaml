# "long-wait": polls testserver once per turn and always replies immediately, leaving the retry loop to long-poll.
apiVersion: ate.dev/v1alpha1
kind: ActorTemplate
metadata:
  name: long-wait-template
  namespace: ${NS}
spec:
  workerSelector:
    matchLabels:
      workload: ${NS}-harness
  containers:
    - name: long-wait
      image: "${LONG_WAIT_IMAGE}"
      command:
        - /app/long-wait
        - --harness-addr
        - 0.0.0.0:80
        - --testserver-addr
        - testserver.${NS}.svc:8080
        - --poll-timeout
        # Must stay comfortably under atenet-router's own per-request timeout.
        - 5s
      env:
        - name: CHECKPOINTD_AGENT
          value: "true"
        - name: CHECKPOINTD_AGENT_ID
          value: long-wait
        - name: CHECKPOINTD_AGENT_CARD
          value: |
            name: Long Wait
            description: Polls script/test-k8s/agents/testserver once per turn and replies immediately -- the payload if notified, or a not-yet signal otherwise
            version: 1.0.0
  snapshotsConfig:
    location: "gs://ate-snapshots/${NS}/long-wait/"
