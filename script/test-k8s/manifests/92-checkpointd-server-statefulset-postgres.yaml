apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkpointd-server
  namespace: ${NS}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: checkpointd-server
  namespace: ${NS}
rules:
  - apiGroups: ["ate.dev"]
    resources: ["actortemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: checkpointd-server
  namespace: ${NS}
subjects:
  - kind: ServiceAccount
    name: checkpointd-server
    namespace: ${NS}
roleRef:
  kind: Role
  name: checkpointd-server
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: checkpointd-server
  namespace: ${NS}
  labels:
    app: checkpointd-server
spec:
  serviceName: checkpointd-server
  replicas: ${CHECKPOINTD_REPLICAS}
  selector:
    matchLabels:
      app: checkpointd-server
  template:
    metadata:
      labels:
        app: checkpointd-server
    spec:
      serviceAccountName: checkpointd-server
      terminationGracePeriodSeconds: ${CHECKPOINTD_TERMINATION_GRACE_SECONDS}
      containers:
        - name: checkpointd-server
          image: "${CHECKPOINTD_IMAGE}"
          command:
            - /checkpointd-app/checkpointd
            - --config=/etc/checkpointd/checkpointd.yaml
            - --discover
            - --addr=:80
            - --base-url=http://checkpointd-server.${NS}.svc:80
            - --substrate-ca-file=/var/run/secrets/ate-system/ca.crt
            - --pod-name=$(POD_NAME)
            - --pod-uid=$(POD_UID)
            - --salvage-sweep-interval=${CHECKPOINTD_SALVAGE_SWEEP_INTERVAL}
            - --log-level=debug
          env:
            - name: CHECKPOINTD_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          restartPolicy: Never
          volumeMounts:
            - name: checkpointd-config
              mountPath: /etc/checkpointd
            - name: ate-token
              mountPath: /var/run/secrets/ate-system
              readOnly: true
      volumes:
        - name: checkpointd-config
          configMap:
            name: checkpointd-config
        - name: ate-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: api.ate-system.svc
                  expirationSeconds: 3600
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: checkpointd-server
  namespace: ${NS}
spec:
  selector:
    app: checkpointd-server
  ports:
    - port: 80
      targetPort: 80
      name: http
