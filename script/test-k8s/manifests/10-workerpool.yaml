# One shared pool of standby workers for every ActorTemplate in this test.
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: ${NS}-harness
  namespace: ${NS}
  labels:
    workload: ${NS}-harness
spec:
  replicas: 8
  workerImage: "${ATEOM_IMAGE}"
  template:
    resources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
