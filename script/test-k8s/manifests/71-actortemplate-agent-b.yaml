# "agent-b": the Task-state state machine both task-state-a2b and task-state-client2b drive.
apiVersion: ate.dev/v1alpha1
kind: ActorTemplate
metadata:
  name: agent-b-template
  namespace: ${NS}
spec:
  workerSelector:
    matchLabels:
      workload: ${NS}-harness
  containers:
    - name: agent-b
      image: "${AGENT_B_IMAGE}"
      command: ["/app/agent-b", "--harness-addr", "0.0.0.0:80"]
      env:
        # Exposed at /agents/agent-b/, needed by both subtests.
        - name: CHECKPOINTD_AGENT
          value: "true"
        - name: CHECKPOINTD_AGENT_ID
          value: agent-b
        - name: CHECKPOINTD_AGENT_CARD
          value: |
            name: Agent B
            description: "A three-turn Task-state state machine: TaskStateWorking (self-continuing), then TaskStateInputRequired, then TaskStateCompleted with a DataPart -- see script/test-k8s/agents/agent_b"
            version: 1.0.0
  snapshotsConfig:
    location: "gs://ate-snapshots/${NS}/agent-b/"
