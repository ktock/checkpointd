# testserver, the minimal notification/counter server long-wait and crash_test_agent use, as a plain Deployment rather than an Agent Substrate actor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testserver
  namespace: ${NS}
  labels:
    app: testserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testserver
  template:
    metadata:
      labels:
        app: testserver
    spec:
      containers:
        - name: testserver
          image: "${TESTSERVER_IMAGE}"
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: testserver
  namespace: ${NS}
spec:
  selector:
    app: testserver
  ports:
    - port: 8080
      targetPort: 8080
      name: http
