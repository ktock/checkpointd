# ActorTemplate for crash_recovery_agent, backing test.sh's
# 02-crash-recovery-from-last-message durability test.
metadata:
  atespace: ${ATESPACE}
  name: crash-recovery-template
workerSelector:
  matchLabels:
    workload: ${NS}-harness
containers:
  - name: crash-recovery-agent
    image: "${CRASH_RECOVERY_AGENT_IMAGE}"
    volumeMounts:
      - name: system-info
        mountPath: /run/ate
    command:
      - /app/crash-recovery-agent
      - --harness-addr
      - 0.0.0.0:80
      - --testserver-addr
      - testserver.${NS}.svc:8080
      - --checkpointd-addr
      - checkpointd-server.${NS}.svc:80
    env:
      - name: CHECKPOINTD_AGENT
        value: "true"
      - name: CHECKPOINTD_AGENT_ID
        value: crash-recovery
      - name: CHECKPOINTD_AGENT_CARD
        value: |
          name: Crash Recovery Agent
          description: Calls echo-agent once, signals testserver, then blocks on a plain wait -- the test script force-deletes this actor's own worker pod once signaled
          version: 1.0.0
      # Substrate denies all egress to an actor without a policy, so this lists what the agent calls.
      - name: CHECKPOINTD_EGRESS_POLICY
        value: |
          rules:
            - hostnames:
                patterns: ["testserver.${NS}.svc"]
            - hostnames:
                patterns: ["checkpointd-server.${NS}.svc"]
# Makes the agent resilient against occasional routing failures or bugs by letting its harness reject a turn addressed to a different actor.
volumes:
  - name: system-info
    systemInfo:
      dataSources:
        - actorMetadata:
            items:
              - field: ACTOR_METADATA_FIELD_NAME
                path: actor-name
snapshotConfig:
  onPause: SNAPSHOT_CONTENT_SCOPE_FULL
  onCommit: SNAPSHOT_CONTENT_SCOPE_FULL
  storageLocation: "gs://ate-snapshots/${NS}/crash-recovery/"
sandboxConfig:
  sandboxClass: SANDBOX_CLASS_GVISOR
  configName: gvisor-default
